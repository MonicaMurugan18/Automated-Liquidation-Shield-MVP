name: CI

# Quality and security gates for the Automated Liquidation Shield.
#
# Three jobs, deliberately separated so a red light tells you *what* broke:
#   backend  -- the engines and the API, 238 tests
#   frontend -- lint and production build
#   security -- dependency advisories and a secret scan
#
# The security job is reported but non-blocking. Advisories appear and
# disappear outside this repo's control, and a submission demo should not go
# red because an upstream package published a CVE overnight. The secret scan
# inside it IS blocking -- that one is entirely our own fault if it fails.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · engines and API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q

      - name: Check every endpoint is registered
        # Catches an import-time error the tests might mask, and a router that
        # silently registered nothing. Counting app.routes would not: this
        # FastAPI version nests included routers, so that count stays at 6
        # whether the API has twelve endpoints or none. The OpenAPI schema is
        # flattened, so it reflects the real surface.
        run: |
          python - <<'PY'
          from app.main import app

          expected = {
              "/api/health",
              "/api/position/analyze",
              "/api/scenario/simulate",
              "/api/strategies/generate",
              "/api/strategies/compare",
              "/api/rescue/validate",
              "/api/rescue/autoexecute",
              "/api/history",
              "/api/assets",
              "/api/defaults",
              "/api/demo/simulate-drop",
              "/api/market/eth-price",
          }
          actual = set(app.openapi()["paths"])
          missing = expected - actual
          if missing:
              raise SystemExit(f"Endpoints missing from the API: {sorted(missing)}")
          print(f"All {len(expected)} endpoints registered ({len(actual)} paths total).")
          PY

  frontend:
    name: Frontend · lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  security:
    name: Security · dependencies and secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --- Secret scanning. Blocking: a committed credential is our bug. ----
      - name: No committed secrets
        run: |
          set -euo pipefail

          # This step must not flag its own pattern definitions. Two defences,
          # belt and braces:
          #   1. every pattern below is STRUCTURAL, so none of them appears as
          #      literal text in this file and none can match itself;
          #   2. this workflow is excluded from the search anyway, as a net.
          # Anything else -- including every other workflow -- is still scanned.
          EXCLUDE=(':!.github/workflows/ci.yml')

          fail=0

          # --- a tracked .env is always a leak; .env.example is expected ------
          # Checked one path at a time on purpose: `git ls-files --error-unmatch`
          # fails as soon as ANY argument is untracked, so passing several paths
          # at once would silently miss a real leak in the first of them.
          while IFS= read -r env_file; do
            echo "::error file=${env_file}::Tracked .env file. Remove it from git history and rotate the keys."
            fail=1
          done < <(git ls-files -- '.env' '**/.env' ':!*.example')

          # --- credential patterns -------------------------------------------
          scan() {
            local message="$1" pattern="$2"
            if git grep -nIE "$pattern" -- . "${EXCLUDE[@]}" ':!*.example'; then
              echo "::error::${message}"
              fail=1
            fi
          }

          scan "A populated SUPABASE_SERVICE_KEY is committed." \
               'SUPABASE_SERVICE_KEY[[:space:]]*[=:][[:space:]]*[A-Za-z0-9._-]{20,}'

          scan "A private key is committed." \
               'BEGIN[[:space:]]+((RSA|EC|DSA|OPENSSH|PGP)[[:space:]]+)?PRIVATE[[:space:]]+KEY'

          # Any JWT, matched by SHAPE (header.payload.signature) rather than by
          # a hard-coded header value. The previous version searched for the
          # literal base64 of {"alg":"HS256","typ":"JWT"}, which meant the
          # workflow matched itself and failed every run. Matching structurally
          # also catches tokens signed with other algorithms, which the literal
          # never would.
          scan "A JSON Web Token is committed." \
               'eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'

          if [ "$fail" -eq 0 ]; then
            echo "No committed secrets found."
          fi
          exit "$fail"

      # --- Dependency advisories. Reported, not blocking. -------------------
      - name: Python dependency audit
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --desc

      - name: npm dependency audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
