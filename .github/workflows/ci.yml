name: CI

# Quality and security gates for the Automated Liquidation Shield.
#
# Three jobs, deliberately separated so a red light tells you *what* broke:
#   backend  -- the engines and the API, 238 tests
#   frontend -- lint and production build
#   security -- dependency advisories and a secret scan
#
# The security job is reported but non-blocking. Advisories appear and
# disappear outside this repo's control, and a submission demo should not go
# red because an upstream package published a CVE overnight. The secret scan
# inside it IS blocking -- that one is entirely our own fault if it fails.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · engines and API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q

      - name: Check the app imports cleanly
        # Catches an import-time error that the tests might mask.
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"

  frontend:
    name: Frontend · lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  security:
    name: Security · dependencies and secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --- Secret scanning. Blocking: a committed credential is our bug. ----
      - name: No committed secrets
        run: |
          set -e
          fail=0

          # A real .env must never be committed. .env.example is expected.
          if git ls-files --error-unmatch backend/.env frontend/.env 2>/dev/null; then
            echo "::error::A .env file is tracked by git. Remove it and rotate the keys."
            fail=1
          fi

          # Supabase service-role keys and private keys, anywhere in the tree.
          if git grep -nE 'SUPABASE_SERVICE_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9._-]{20,}' -- . ':!*.example' ; then
            echo "::error::A populated SUPABASE_SERVICE_KEY is committed."
            fail=1
          fi
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ; then
            echo "::error::A private key is committed."
            fail=1
          fi
          # Supabase anon/service JWTs start with this header.
          if git grep -nE 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' -- . ; then
            echo "::error::A JWT that looks like a Supabase key is committed."
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then echo "No committed secrets found."; fi
          exit $fail

      # --- Dependency advisories. Reported, not blocking. -------------------
      - name: Python dependency audit
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --desc

      - name: npm dependency audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
